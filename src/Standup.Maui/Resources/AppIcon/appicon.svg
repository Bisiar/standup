<?xml version="1.0" encoding="utf-8"?>
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 456 456">
  <!-- BuildBot Midnight - App Icon with Background -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1E3A5F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0F172A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="midnightGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="456" height="456" fill="url(#bgGrad)" rx="45"/>

  <!-- BuildBot centered and scaled (original 200x200 -> scaled ~2x and centered) -->
  <g transform="translate(78, 48) scale(1.5)">
    <!-- Antenna -->
    <line x1="100" y1="25" x2="100" y2="40" stroke="#374151" stroke-width="4" stroke-linecap="round"/>
    <circle cx="100" cy="20" r="8" fill="#A78BFA"/>

    <!-- Robot head -->
    <rect x="55" y="40" width="90" height="70" rx="15" fill="url(#midnightGrad)"/>

    <!-- Eyes - cool/focused -->
    <rect x="68" y="58" width="24" height="18" rx="4" fill="white"/>
    <rect x="108" y="58" width="24" height="18" rx="4" fill="white"/>

    <!-- Eye pupils - looking slightly up (thinking) -->
    <rect x="74" y="58" width="12" height="10" rx="2" fill="#1D4ED8"/>
    <rect x="114" y="58" width="12" height="10" rx="2" fill="#1D4ED8"/>

    <!-- Mouth - slight smirk -->
    <path d="M82 92 L105 92 L115 88" stroke="white" stroke-width="3" fill="none" stroke-linecap="round"/>

    <!-- Body -->
    <rect x="65" y="115" width="70" height="45" rx="10" fill="url(#midnightGrad)"/>

    <!-- Chest display -->
    <rect x="80" y="125" width="40" height="25" rx="5" fill="#1F2937"/>
    <text x="100" y="143" font-family="monospace" font-size="12" fill="#60A5FA" text-anchor="middle">&gt;_</text>

    <!-- Arms in working position -->
    <line x1="65" y1="135" x2="35" y2="155" stroke="#374151" stroke-width="6" stroke-linecap="round"/>
    <line x1="135" y1="135" x2="165" y2="155" stroke="#374151" stroke-width="6" stroke-linecap="round"/>

    <!-- Hand nodes -->
    <circle cx="30" cy="160" r="14" fill="#A78BFA"/>
    <circle cx="170" cy="160" r="14" fill="#34D399"/>

    <!-- Feet -->
    <rect x="72" y="160" width="20" height="15" rx="5" fill="#374151"/>
    <rect x="108" y="160" width="20" height="15" rx="5" fill="#374151"/>

    <!-- Decorative bolts -->
    <circle cx="50" cy="75" r="5" fill="#A78BFA"/>
    <circle cx="150" cy="75" r="5" fill="#A78BFA"/>
  </g>
</svg>
